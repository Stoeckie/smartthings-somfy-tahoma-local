name: tahoma-shade
components:
  - id: main
    capabilities:
      - id: windowShade
        version: 1
      - id: windowShadeLevel
        version: 1
      - id: windowShadePreset
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Blind
preferences:
  - name: invert
    title: Reverse direction
    description: Turn on if open and closed are swapped for this shade.
    required: false
    preferenceType: boolean
    definition:
      default: false
